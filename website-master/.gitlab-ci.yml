variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  DOCKER_CACHE_IMAGE: $CI_REGISTRY_IMAGE:cache

stages:
  - build
  - deploy

.protected_branch_job: &protected_branch_job
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.branch_rules: &branch_rules
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      variables:
        SERVER_IP: $DEV_SERVER_IP
        SERVER_USER: $DEV_SERVER_USER
        SSH_PRIVATE_KEY_GITLAB: $DEV_SSH_PRIVATE_KEY_GITLAB
        SERVER_URL: 'footballshop.com.ua'
        NETWORK_NAME: root_app-network
        NODE_ENV: production
        Container_Name: frontend
        PATH_TO_ENV: /root/configs/front/prod/.env
        PORT: 3005
        NEXT_PUBLIC_API_URL_API: 'https://footballshop.com.ua/api/v1'
        NEXT_PUBLIC_API_URL_IMAGE: 'https://footballshop.com.ua/storage/'
        SITE_URL: 'https://footballshop.com.ua'
        WEBSITE_URL: 'https://footballshop.com.ua'
        NEXTAUTH_SECRET: $PROD_NEXTAUTH_SECRET
        NEXTAUTH_URL: 'https://footballshop.com.ua'
        GOOGLE_CLIENT_ID: $PROD_GOOGLE_CLIENT_ID
        GOOGLE_CLIENT_SECRET: $PROD_GOOGLE_CLIENT_SECRET
        FACEBOOK_CLIENT_ID: $PROD_FACEBOOK_CLIENT_ID
        FACEBOOK_CLIENT_SECRET: $PROD_FACEBOOK_CLIENT_SECRET
    - if: $CI_COMMIT_BRANCH == "develop"
      variables:
        SERVER_IP: $DEV_SERVER_IP
        SERVER_USER: $DEV_SERVER_USER
        SSH_PRIVATE_KEY_GITLAB: $DEV_SSH_PRIVATE_KEY_GITLAB
        SERVER_URL: 'develop.footballshop.com.ua'
        NETWORK_NAME: root_app-network
        NODE_ENV: development
        Container_Name: frontend-dev
        PATH_TO_ENV: /root/configs/front/dev/.env
        PORT: 3010
        NEXT_PUBLIC_API_URL_API: 'https://develop.footballshop.com.ua/api/v1'
        NEXT_PUBLIC_API_URL_IMAGE: 'https://develop.footballshop.com.ua/storage/'
        SITE_URL: 'https://develop.footballshop.com.ua'
        WEBSITE_URL: 'https://develop.footballshop.com.ua'
        NEXTAUTH_SECRET: $PROD_NEXTAUTH_SECRET
        NEXTAUTH_URL: 'https://develop.footballshop.com.ua'
        GOOGLE_CLIENT_ID: $PROD_GOOGLE_CLIENT_ID
        GOOGLE_CLIENT_SECRET: $PROD_GOOGLE_CLIENT_SECRET
        FACEBOOK_CLIENT_ID: $PROD_FACEBOOK_CLIENT_ID
        FACEBOOK_CLIENT_SECRET: $PROD_FACEBOOK_CLIENT_SECRET


build:
  <<: [*branch_rules, *protected_branch_job]
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_DEBUG: "true"
    DOCKER_API_VERSION: "1.41"
    DOCKER_TIMEOUT: "120"
  script:
    - docker --version
    - docker info
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $DOCKER_CACHE_IMAGE || true
    - |
      cat > .env << EOF
      NEXT_PUBLIC_API_URL_API=$NEXT_PUBLIC_API_URL_API
      NEXT_PUBLIC_API_URL_IMAGE=$NEXT_PUBLIC_API_URL_IMAGE
      SITE_URL=$SITE_URL
      WEBSITE_URL=$WEBSITE_URL
      NEXTAUTH_SECRET=$NEXTAUTH_SECRET
      NEXTAUTH_URL=$NEXTAUTH_URL
      GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
      GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
      FACEBOOK_CLIENT_ID=$FACEBOOK_CLIENT_ID
      FACEBOOK_CLIENT_SECRET=$FACEBOOK_CLIENT_SECRET
      NEXT_PUBLIC_SITE_DOMAIN=$SERVER_URL
      EOF
    - docker build
      --build-arg WWWGROUP=1000
      --build-arg NODE_VERSION=18
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from $DOCKER_CACHE_IMAGE
      --target runner
      -t $DOCKER_IMAGE
      -t $DOCKER_CACHE_IMAGE
      -f ./Dockerfile .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_CACHE_IMAGE


deploy:
  <<: [*branch_rules, *protected_branch_job]
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - base64 -d "$SSH_PRIVATE_KEY_GITLAB" > deploy_key
    - chmod 600 deploy_key
    - ssh-add deploy_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - |
      ssh $SERVER_USER@$SERVER_IP "
        docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY &&
        docker pull $DOCKER_IMAGE &&
        docker stop $Container_Name || true &&
        docker rm -f $Container_Name || true &&
        docker run -d --name $Container_Name \
          --network $NETWORK_NAME \
          -v  $PATH_TO_ENV:/app/.env \
          -e Node_ENV=$NODE_ENV \
          -p $PORT:3000 $DOCKER_IMAGE &&
        docker image prune -a -f
      "
  environment:
    name: production
    url: http://$SERVER_URL